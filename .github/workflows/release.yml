name: Release packages

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit on prod that passed the complete CI gate
        required: true
        type: string
      bootstrap_all:
        description: First release only—publish every @lithekit package
        required: false
        default: false
        type: boolean

concurrency:
  group: release-prod
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24
  NPM_VERSION: 11.6.2

jobs:
  publish:
    name: Publish affected Lithekit packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.npmjs.com/org/lithekit
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install release tooling
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require the tested prod commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_SHA")"
          git merge-base --is-ancestor HEAD origin/prod
      - name: Build, verify, publish, tag, and create releases
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun tooling/scripts/packages/release.ts --publish ${{ inputs.bootstrap_all && '--all' || '' }}
