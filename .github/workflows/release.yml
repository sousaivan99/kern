name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [prod]

concurrency:
  group: release-prod
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24
  NPM_VERSION: 11.6.2

jobs:
  publish:
    name: Publish @sousaivan/kern
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.npmjs.com/package/@sousaivan/kern
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Set up Node and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install release tooling
        run: npm install --global npm@${NPM_VERSION}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read and validate release version
        id: package
        shell: bash
        run: |
          NAME=$(node --input-type=module --eval "import manifest from './packages/kern/package.json' with { type: 'json' }; process.stdout.write(manifest.name)")
          VERSION=$(node --input-type=module --eval "import manifest from './packages/kern/package.json' with { type: 'json' }; process.stdout.write(manifest.version)")
          node --eval "if (!/^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$/.test(process.argv[1])) process.exit(1)" "$VERSION"
          grep -F "## [$VERSION]" packages/kern/CHANGELOG.md >/dev/null
          if npm view "$NAME@$VERSION" version --json >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION already exists on npm. Bump the version before merging into prod."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify release artifact
        run: bun run package:check
      - name: Publish package with provenance
        working-directory: packages/kern
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG"
          --target "$RELEASE_SHA"
          --title "@sousaivan/kern $RELEASE_VERSION"
          --generate-notes
