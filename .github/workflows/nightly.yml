name: Nightly fuzzing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  fuzz:
    name: Rotating-seed properties
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run reproducible randomized properties
        env:
          KERN_FUZZ_CASES: 25000
          KERN_FUZZ_SEED: ${{ github.run_id }}
        run: |
          echo "KERN_FUZZ_SEED=$KERN_FUZZ_SEED"
          echo "KERN_FUZZ_CASES=$KERN_FUZZ_CASES per property"
          bun run test:fuzz
