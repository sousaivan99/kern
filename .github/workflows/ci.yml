name: CI

on:
  push:
    branches: [develop, prod]
  pull_request:
    branches: [develop, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, package-manager-cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run packages:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:minimum
      - run: bun run test:coverage
      - run: bun --filter @lithekit/tooling test
      - run: bun run test:timezones

  package:
    name: Packed packages and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, package-manager-cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run package:check
      - run: bun run size:check
      - run: bun run benchmark:quick
      - run: bun run audit

  docs-frameworks:
    name: Documentation and framework fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, package-manager-cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun tooling/node_modules/playwright/cli.js install --with-deps chromium
      - run: bun run docs:check
      - run: bun run test:frameworks

  browsers:
    name: Form / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: { browser: [chromium, firefox, webkit] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun tooling/node_modules/playwright/cli.js install --with-deps "${{ matrix.browser }}"
      - run: bun tooling/scripts/packages/browser-check.ts --browser="${{ matrix.browser }}"

  runtime:
    name: Runtime / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Node 22, runtime: node, version: "22" }
          - { name: Node 24, runtime: node, version: "24" }
          - { name: Node 26, runtime: node, version: "26" }
          - { name: Bun 1.3 minimum, runtime: bun, version: 1.3.0 }
          - { name: Bun latest, runtime: bun, version: latest }
          - { name: Deno latest, runtime: deno, version: v2.x }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.runtime == 'node'
        with: { node-version: "${{ matrix.version }}", package-manager-cache: false }
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
        if: matrix.runtime == 'deno'
        with: { deno-version: "${{ matrix.version }}" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.runtime == 'bun'
        with: { bun-version: "${{ matrix.version }}" }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:packages
      - name: Runtime smoke
        if: matrix.runtime != 'deno'
        run: ${{ matrix.runtime }} tooling/fixtures/compat/runtime-smoke.mjs packages/validation/dist packages/money/dist packages/date/dist packages/number/dist packages/string/dist packages/array/dist packages/object/dist packages/async/dist
      - name: Deno smoke
        if: matrix.runtime == 'deno'
        run: deno run --allow-read tooling/fixtures/compat/runtime-smoke.mjs packages/validation/dist packages/money/dist packages/date/dist packages/number/dist packages/string/dist packages/array/dist packages/object/dist packages/async/dist
