name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint and formatting
        run: bun run lint
      - name: TypeScript current
        run: bun run typecheck
      - name: TypeScript minimum
        run: bun run typecheck:minimum

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Package tests and coverage
        run: bun run test:coverage
      - name: Seeded property and fuzz tests
        run: bun run test:fuzz
      - name: Tooling tests
        run: bun --filter @kern/tooling test
      - name: Timezone matrix
        run: bun run test:timezones

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify packed package
        run: bun run package:check
      - name: Enforce bundle budgets
        run: bun run size:check
      - name: Benchmark smoke
        run: bun run benchmark:quick
      - name: Audit dependencies
        run: bun run audit
      - name: Upload runtime build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kern-runtime-build
          path: packages/kern/dist
          if-no-files-found: error
          retention-days: 1

  docs:
    name: Documentation and browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: bun tooling/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build package
        run: bun run build:kern
      - name: Verify documentation
        run: bun run docs:check
      - name: Verify browser bundle
        run: bun run test:browser

  frameworks:
    name: Framework tutorials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: bun tooling/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify framework tutorials
        run: bun run test:frameworks

  runtime:
    name: Runtime / ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22
            runtime: node
            version: "22"
          - name: Node 24
            runtime: node
            version: "24"
          - name: Node 26
            runtime: node
            version: "26"
          - name: Bun 1.3 minimum
            runtime: bun
            version: 1.3.0
          - name: Bun latest
            runtime: bun
            version: latest
          - name: Deno latest
            runtime: deno
            version: v2.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download runtime build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kern-runtime-build
          path: packages/kern/dist
      - name: Set up Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version }}
          package-manager-cache: false
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.version }}
      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}
      - name: Test Node runtime
        if: matrix.runtime == 'node'
        run: node packages/kern/tests/compat/runtime-smoke.mjs
      - name: Test native Temporal across time zones
        if: matrix.runtime == 'node' && matrix.version == '26'
        run: |
          TZ=UTC node packages/kern/tests/compat/runtime-smoke.mjs
          TZ=America/New_York node packages/kern/tests/compat/runtime-smoke.mjs
          TZ=Europe/Luxembourg node packages/kern/tests/compat/runtime-smoke.mjs
          TZ=Australia/Lord_Howe node packages/kern/tests/compat/runtime-smoke.mjs
      - name: Test Bun runtime
        if: matrix.runtime == 'bun'
        run: bun packages/kern/tests/compat/runtime-smoke.mjs
      - name: Test Deno runtime
        if: matrix.runtime == 'deno'
        run: deno run --allow-read packages/kern/tests/compat/runtime-smoke.mjs

  check:
    name: check
    if: always()
    needs: [quality, tests, package, docs, frameworks, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.frameworks.result }}" = success
          test "${{ needs.runtime.result }}" = success
