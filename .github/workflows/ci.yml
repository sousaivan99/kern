name: CI

on:
  push:
    branches: [develop, prod]
  pull_request:
    branches: [develop, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint and formatting
        run: bun run lint
      - name: TypeScript current
        run: bun run typecheck
      - name: TypeScript minimum
        run: bun run typecheck:minimum

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Package tests and coverage
        run: bun run test:coverage
      - name: Seeded property and fuzz tests
        run: bun run test:fuzz
      - name: Tooling tests
        run: bun --filter @kern/tooling test
      - name: Timezone matrix
        run: bun run test:timezones

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify packed package
        run: bun tooling/scripts/kern/package-check.ts --tarball-output=.artifacts/kern.tgz
      - name: Enforce bundle budgets
        run: bun run size:check
      - name: Benchmark smoke
        run: bun run benchmark:quick
      - name: Audit dependencies
        run: bun run audit
      - name: Upload runtime build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kern-runtime-build
          path: packages/kern/dist
          if-no-files-found: error
          retention-days: 1
      - name: Upload packed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kern-package-tarball
          path: .artifacts/kern.tgz
          if-no-files-found: error
          retention-days: 1

  docs:
    name: Documentation and browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: bun tooling/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build package
        run: bun run build:kern
      - name: Verify documentation
        run: bun run docs:check
      - name: Verify browser bundle
        run: bun run test:browser

  frameworks:
    name: Framework tutorials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: bun tooling/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify framework tutorials
        run: bun run test:frameworks

  browser-engines:
    name: Browser / ${{ matrix.browser }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install browser engine
        run: bun tooling/node_modules/playwright/cli.js install --with-deps "${{ matrix.browser }}"
      - name: Download runtime build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kern-runtime-build
          path: packages/kern/dist
      - name: Verify browser bundle
        run: bun tooling/scripts/kern/browser-smoke.ts --browser="${{ matrix.browser }}"

  runtime:
    name: Runtime / ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22
            runtime: node
            version: "22"
          - name: Node 24
            runtime: node
            version: "24"
          - name: Node 26
            runtime: node
            version: "26"
          - name: Bun 1.3 minimum
            runtime: bun
            version: 1.3.0
          - name: Bun latest
            runtime: bun
            version: latest
          - name: Deno latest
            runtime: deno
            version: v2.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packed package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kern-package-tarball
          path: .artifacts
      - name: Set up Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.version }}
          package-manager-cache: false
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.version }}
      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}
      - name: Test Node runtime
        if: matrix.runtime == 'node'
        run: node tooling/scripts/kern/packed-runtime-smoke.mjs --runtime=node --tarball=.artifacts/kern.tgz
      - name: Test native Temporal across time zones
        if: matrix.runtime == 'node' && matrix.version == '26'
        run: |
          TZ=UTC node tooling/scripts/kern/packed-runtime-smoke.mjs --runtime=node --tarball=.artifacts/kern.tgz
          TZ=America/New_York node tooling/scripts/kern/packed-runtime-smoke.mjs --runtime=node --tarball=.artifacts/kern.tgz
          TZ=Europe/Luxembourg node tooling/scripts/kern/packed-runtime-smoke.mjs --runtime=node --tarball=.artifacts/kern.tgz
          TZ=Australia/Lord_Howe node tooling/scripts/kern/packed-runtime-smoke.mjs --runtime=node --tarball=.artifacts/kern.tgz
      - name: Test Bun runtime
        if: matrix.runtime == 'bun'
        run: node tooling/scripts/kern/packed-runtime-smoke.mjs --runtime=bun --tarball=.artifacts/kern.tgz
      - name: Test Deno runtime
        if: matrix.runtime == 'deno'
        run: node tooling/scripts/kern/packed-runtime-smoke.mjs --runtime=deno --tarball=.artifacts/kern.tgz

  release-contract:
    name: Release contract
    if: github.event_name == 'pull_request' && github.base_ref == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Require the development branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: test "$HEAD_BRANCH" = develop
      - name: Validate release version and changelog
        run: bun tooling/scripts/kern/release-contract.ts --check-npm

  check:
    name: check
    if: always()
    needs: [quality, tests, package, docs, frameworks, browser-engines, runtime, release-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.frameworks.result }}" = success
          test "${{ needs.browser-engines.result }}" = success
          test "${{ needs.runtime.result }}" = success
          test "${{ needs.release-contract.result }}" = success || test "${{ needs.release-contract.result }}" = skipped

  release-changes:
    name: Detect release changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_required: ${{ steps.release.outputs.release_required }}
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Compare package inputs with the latest release
        id: release
        run: bun tooling/scripts/kern/release-contract.ts --github-output --check-npm

  release:
    name: Start release
    needs: [check, release-changes]
    if: >-
      always() &&
      needs.check.result == 'success' &&
      needs.release-changes.result == 'success' &&
      needs.release-changes.outputs.release_required == 'true'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the tested commit to the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          gh workflow run release.yml
          --repo "$GITHUB_REPOSITORY"
          --ref prod
          --field release_sha="$RELEASE_SHA"
