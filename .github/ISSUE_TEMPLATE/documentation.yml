name: Documentation improvement
description: Report missing, confusing, incorrect, or inaccessible documentation and examples.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Documentation reports are welcome from every experience level. If something confused you, the documentation can probably explain it better.

  - type: input
    id: location
    attributes:
      label: Page or section
      description: Paste the URL, file path, helper name, or heading. Use “not sure” if you cannot find the right page.
      placeholder: "https://… / Money → formatMoney / not sure"
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: What kind of problem is it?
      options:
        - Missing explanation
        - Missing success example
        - Missing error example
        - Incorrect information
        - Example does not run
        - Difficult for a beginner to understand
        - Accessibility or layout problem
        - Broken link
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What was confusing or incorrect?
      description: Tell us what you were trying to learn and where you became stuck.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What would have helped?
      description: Describe the explanation, example, result, error, or layout you expected. Beginners do not need to provide a technical solution.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, console output, suggested wording, or related links. You can leave this blank.

